<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - ClipVid Studio</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/timeline.css">
    <link rel="stylesheet" href="../css/adjustments.css">
</head>
<body>
    <div class="editor-layout">
        <header class="editor-header flex items-center justify-between">
            <div class="flex items-center gap-20">
                <a href="index.html" class="logo" style="text-decoration:none; color:inherit;">
                    <img src="../../public/logo_nobackground.png" alt="ClipVid Studio Logo" style="width: 120px; height: 150px; margin-right: -20px; margin-left: -20px;">
                    <span>ClipVid Studio</span>
                </a>
                <span id="project-title-display" style="font-weight: 500; margin-left: 20px; color: var(--text-muted);"></span>
            </div>
            <div class="flex items-center" style="gap:16px;">
                <div class="flex" style="gap:8px; border-right: 1px solid #eee; padding-right: 16px; margin-right: 8px;">
                    <button class="btn btn-outline" id="play-btn">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        Play
                    </button>
                </div>
                <div class="flex" style="gap:8px;">
                    <button class="btn btn-outline">Undo</button>
                    <button class="btn btn-outline">Redo</button>
                    <button class="btn btn-primary">Export</button>
                </div>
            </div>
        </header>

        <main class="editor-main">
            <aside class="editor-sidebar">
                <button class="sidebar-add-btn" id="add-media-btn">+</button>
                <input type="file" id="media-upload-input" accept="image/*" multiple style="display: none;">
                
                <a href="#" class="sidebar-item active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a3.5 3.5 0 1 1 0-7c.3 0 .5.03.8.08V12a5 5 0 0 0-10 0v.1A3.5 3.5 0 1 0 9 19h8.5Z"/><path d="M12 12v6"/><path d="m9 15 3-3 3 3"/></svg>
                    <span>Media</span>
                </a>

                <a href="#" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
                    <span>Canvas</span>
                </a>

                <a href="#" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                    <span>Text</span>
                </a>

                <a href="#" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
                    <span>Audio</span>
                </a>

                <a href="#" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 8 6 4-6 4Z"/></svg>
                    <span>Videos</span>
                </a>

                <a href="#" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                    <span>Images</span>
                </a>

                <a href="#" class="sidebar-item">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4L2 13h20L12 3z"/><circle cx="12" cy="15" r="6.5"/></svg>
                    <span>Elements</span>
                </a>
            </aside>

            <div class="editor-workspace">
                <div class="workspace-top">
                    <div class="adjustment-panel">
                        <div class="adjustment-header">
                            <h3>Adjustments</h3>
                            <div class="adjustment-tabs">
                                <button class="tab-btn active" data-tab="static">Static</button>
                                <button class="tab-btn" data-tab="colour">Colour</button>
                            </div>
                        </div>

                        <div id="static-adjustments" class="tab-content active">
                            <div class="adjustment-group">
                                <label>Animation</label>
                                <select id="anim-select">
                                    <option value="none">None</option>
                                    <option value="fade">Fade</option>
                                    <option value="slide">Slide</option>
                                    <option value="zoom">Zoom</option>
                                </select>
                            </div>
                            <div class="adjustment-group">
                                <label>Filter</label>
                                <select id="filter-select">
                                    <option value="none">None</option>
                                    <option value="grayscale">Grayscale</option>
                                    <option value="sepia">Sepia</option>
                                    <option value="invert">Invert</option>
                                    <option value="blur">Blur</option>
                                </select>
                            </div>
                            <div class="adjustment-group">
                                <label>Image Duration (s)</label>
                                <select id="duration-input">
                                    <option value="1">1</option>
                                    <option value="2">2</option>
                                    <option value="3">3</option>
                                    <option value="4">4</option>
                                    <option value="5">5</option>
                                </select>
                            </div>
                        </div>

                        <div id="colour-adjustments" class="tab-content">
                            <div class="adjustment-group">
                                <div class="label-row">
                                    <label>Brightness</label>
                                    <span class="value-display" id="brightness-val">100%</span>
                                </div>
                                <input type="range" id="brightness-slider" min="0" max="200" value="100">
                            </div>
                            <div class="adjustment-group">
                                <div class="label-row">
                                    <label>Contrast</label>
                                    <span class="value-display" id="contrast-val">100%</span>
                                </div>
                                <input type="range" id="contrast-slider" min="0" max="200" value="100">
                            </div>
                            <div class="adjustment-group">
                                <div class="label-row">
                                    <label>Saturation</label>
                                    <span class="value-display" id="saturation-val">100%</span>
                                </div>
                                <input type="range" id="saturation-slider" min="0" max="200" value="100">
                            </div>
                        </div>
                        
                        <p id="no-clip-message" style="margin-top: 20px; color: #999; display: none;">Select a clip to see properties.</p>
                    </div>
                    <div class="canvas-area" id="canvas-area">
                        <div class="placeholder-box" id="preview-placeholder">
                            <div style="font-size: 3rem; margin-bottom: 10px;">🎬</div>
                            <p>Video Preview Area</p>
                            <p style="font-size: 0.8rem;" id="aspect-ratio-display"></p>
                        </div>
                    </div>
                </div>
                
                <div class="timeline-area">
                    <div class="timeline-header">
                        <span>Timeline (Ctrl+Scroll to Zoom)</span>
                        <span id="timecode">00:00:00 / 00:00:00</span>
                    </div>
                    <div class="timeline-ruler"></div>
                    <div class="timeline-content">
                        <div class="playhead"></div>
                        <div class="timeline-tracks-container">
                            <div class="track video">
                                <div class="track-label">Video</div>
                                <div class="track-content"></div>
                            </div>
                            <div class="track audio">
                                <div class="track-label">Audio</div>
                                <div class="track-content"></div>
                            </div>
                            <div class="track text">
                                <div class="track-label">Text</div>
                                <div class="track-content"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../scripts/editor.js"></script>
    <script src="../scripts/timeline.js"></script>
    <script src="../scripts/adjustments.js"></script>
</body>
</html>
