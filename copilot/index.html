<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Copilot - Client-side Video Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-inner">
        <div class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
            <rect width="24" height="24" rx="4" fill="#1f66e5"></rect>
            <path d="M6 8l6 4-6 4V8z" fill="#fff"></path>
          </svg>
          <span class="nav-title">Video Maker</span>
        </div>
        <div class="nav-right"></div>
      </div>
    </nav>
    <header class="hero">
        <h1>Video Studio</h1>
      </div>
    </header>

    <main class="container">
      <aside class="sidebar">
        <section class="panel">
          <h2>Import Media</h2>
          <label class="field">
            <span>Images</span>
            <input id="imagesInput" type="file" accept="image/*" multiple />
          </label>
          <label class="field">
            <span>Audio</span>
            <input id="audioInput" type="file" accept="audio/*" />
          </label>
          <p class="hint">
            Add multiple images. Each will play for 3 seconds.
          </p>
        </section>

        <section class="panel">
          <h2>Transition</h2>
          <label class="field">
            <span>Select transition type:</span>
            <select id="transitionSelect">
              <option value="fade">Fade</option>
              <option value="slide">Slide</option>
              <option value="zoom">Zoom</option>
              <option value="cut">Cut</option>
            </select>
          </label>
        </section>

        <section class="panel">
          <h2>Audio Trim</h2>
          <div class="trim-grid">
            <label class="field">
              <span>Start (s)</span>
              <input id="audioStart" type="number" min="0" step="0.1" value="0" />
            </label>
            <label class="field">
              <span>End (s)</span>
              <input id="audioEnd" type="number" min="0" step="0.1" value="0" />
            </label>
          </div>
          <p id="audioInfo" class="hint">No audio loaded.</p>
        </section>
      </aside>

      <section class="workspace">
        <div class="preview">
          <canvas id="previewCanvas" width="1280" height="720"></canvas>
          <div class="controls">
            <button id="playBtn" type="button">Play</button>
            <button id="pauseBtn" type="button">Pause</button>
            <button id="stopBtn" type="button">Stop</button>
            <button id="exportBtn" type="button" class="primary">Export Video</button>
          </div>
          <div class="progress-wrap">
            <div id="progressBar" class="progress-bar">
              <div id="progressFill"></div>
            </div>
            <div id="timeLabel">0.00 / 0.00</div>
          </div>
          <p id="statusLabel" class="status">Ready.</p>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
